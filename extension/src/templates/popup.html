<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwarmTube</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <h2>SwarmTube!</h2>
    
    <main>
        <div id="toggle" class="on">
            <span>ON</span>
            <span>OFF</span>
            <div class="bubble active"></div>
        </div>
    </main>

    <section id="emote-set">
        <span id="emote-set-header">Twitch streamer name</span>
        <input type="text" id="twitch-name" name="twitch-name" value="vedal987"><button id="twitch-name-set" class="input-btn">Set</button>
        <span id="emote-set-note">NOTE: Changing emote set requires Twitch authorization</span>
    </section>
    
    <section id="emote-exclusion">
        <span id="emote-set-header">Exclude specific emotes</span>
        <svg id="emote-list" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>

        <input type="text" id="excluded-emotes" name="excluded-emotes" value=""><button id="excluded-emotes-set" class="input-btn">Add</button>
        <span id="emote-set-note">NOTE: emote names are case-sensitive</span>
    </section>

    <section id="size-picker">
        <span id="size-picker-header">Emote Size</span>
        <div id="range-wrapper">
            <input type="range" id="emote-size" name="emote-size" min="1" max="4" value="2">
            <span id="size-value">2x</span>
        </div>
        <span id="emote-set-note">NOTE: Above 2x might require manual emote reload</span>
    </section>

    <div id="lower-wrapper">
        <button id="refresh-emotes">Reload Emotes</button>
        <div id="twitch-checkbox" class="off">
            <svg data-name="Social Media Icons" id="Social_Media_Icons" viewBox="0 0 512 512"
                xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <style>
                        .cls-1 {
                            fill: #6e37be;
                        }
        
                        .cls-2 {
                            fill: #fff;
                        }
                    </style>
                </defs>
                <g id="Twitch">
                    <path id="twitch-outline" class="cls-1"
                        d="M10.5,88.31v346.2a12,12,0,0,0,12,12h99.23a12,12,0,0,1,12,12V500a12,12,0,0,0,12,12h49.92a12,12,0,0,0,8.5-3.52l59.16-59.15a12,12,0,0,1,8.5-3.52h88.21a12,12,0,0,0,8.5-3.53L498,312.88a12,12,0,0,0,3.52-8.5V12a12,12,0,0,0-12-12H51.65A12,12,0,0,0,40.42,7.73L11.29,84A11.85,11.85,0,0,0,10.5,88.31Z" />
                    <g data-name="&lt;Group&gt;" id="_Group_">
                        <path class="cls-2"
                            d="M87.93,45.76V369.08h99.69v69.4l69.29-69.4h121.6l79.29-73.21V45.76Zm169.51,209.9a12,12,0,0,1-12,12H222.5a12,12,0,0,1-12-12V143.52a12,12,0,0,1,12-12h22.92a12,12,0,0,1,12,12Zm121.71,0a12,12,0,0,1-12,12H344.21a12,12,0,0,1-12-12V143.52a12,12,0,0,1,12-12h22.91a12,12,0,0,1,12,12Z" />
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <footer>
        <span>Developed by @IggyTheAxolotl</span><br>
        <span>Swarm Property. All rights reserved. v1.24</span>
    </footer>

    <script src="../scripts/popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Welcome to SwarmTube!</h2>
    
    <main>
        <div id="toggle" class="on">
            <span>ON</span>
            <span>OFF</span>
            <div class="bubble active"></div>
        </div>
    </main>

    <section id="emote-set">
        <span id="emote-set-header">Twitch streamer name</span>
        <input type="text" id="twitch-name" name="twitch-name" value="vedal987"><button id="twitch-name-set" onclick="SetTwitchName()">Set</button>
        <span id="emote-set-note">NOTE: default is vedal987</span>
    </section>
    
    <script src="popup.js"></script>
</body>
</html>

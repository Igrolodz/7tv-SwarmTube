<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Welcome to SwarmTube!</h2>
    
    <main>
        <div id="toggle" class="on">
            <span>ON</span>
            <span>OFF</span>
            <div class="bubble active"></div>
        </div>
    </main>

    <section id="emote-set">
        <span id="emote-set-header">Twitch streamer name</span>
        <input type="text" id="twitch-name" name="twitch-name" value="vedal987"><button id="twitch-name-set">Set</button>
        <span id="emote-set-note">NOTE: default is vedal987</span>
    </section>
    
    <!-- exclude specific emotes -->
    <section id="emote-exclusion">
        <span id="emote-set-header">Exclude specific emotes</span>
        <svg id="emote-list" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>

        <input type="text" id="excluded-emotes" name="excluded-emotes" value=""><button id="excluded-emotes-set">Add</button>
        <span id="emote-set-note">NOTE: emote names are case-sensitive</span>
    </section>

    <script src="popup.js"></script>
</body>
</html>
